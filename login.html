<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin sign in · NTU Cup</title>
    <link rel="icon" href="src/utility/volleyball.png" type="image/png">
    <style>
        :root { color-scheme: light dark; font-family: Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #eef2f7; color: #172033; }
        main { width: min(440px, 100%); padding: 32px; border-radius: 18px; background: white; box-shadow: 0 18px 50px rgba(25, 40, 70, .14); }
        .eyebrow { margin: 0 0 8px; color: #3478c8; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; }
        h1 { margin: 0 0 10px; font-size: 2rem; }
        p { line-height: 1.55; }
        label { display: block; margin: 24px 0 8px; font-weight: 700; }
        input, button { width: 100%; min-height: 48px; border-radius: 10px; font: inherit; }
        input { border: 1px solid #aeb8c8; padding: 0 14px; background: white; color: #172033; }
        button { margin-top: 14px; border: 0; padding: 0 18px; background: #1769c2; color: white; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #login-status { min-height: 24px; margin-bottom: 0; }
        #login-status[data-state="error"] { color: #a51d2d; }
        #login-status[data-state="success"] { color: #176b3a; }
        .public-link { display: inline-block; margin-top: 24px; color: #1769c2; }
        @media (prefers-color-scheme: dark) {
            body { background: #111827; color: #edf2f7; }
            main { background: #1f2937; }
            input { background: #111827; color: #edf2f7; border-color: #58677c; }
            .public-link { color: #7db8ff; }
        }
    </style>
    <script defer src="src/utility/runtime-config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
    <script defer src="src/utility/login.js"></script>
</head>
<body>
    <main>
        <p class="eyebrow">NTU Cup organizer</p>
        <h1>Admin sign in</h1>
        <p>Enter an approved administrator email. We’ll send a one-time sign-in link—no password required.</p>
        <form id="login-form">
            <label for="email">Administrator email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <button id="login-submit" type="submit">Send sign-in link</button>
        </form>
        <p id="login-status" role="status" aria-live="polite"></p>
        <a class="public-link" href="https://andrew-is-alive.github.io/ntucup/">View public results</a>
    </main>
</body>
</html>
